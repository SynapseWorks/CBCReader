name: Update World Reader

on:
  schedule:
    - cron: '17 13,19,1 * * *'  # 08/14/20 EST; 09/15/21 EDT
  workflow_dispatch: {}
  push:
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write

concurrency:
  group: cbc-news-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper (schedule controlled by workflow)
        run: python scraper/main.py --force
        # For a one-off test, you can temporarily force:
        # run: python scraper/main.py --force

      - name: Show changed files (debug)
        run: |
          ls -la data || true
          ls -la docs/data || true
          git status --porcelain -- data/latest.json docs/data/latest.json || true

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push updated JSON only if changed
        run: |
          CHANGED=$(git status --porcelain -- data/latest.json docs/data/latest.json | wc -l | tr -d ' ')
          if [ "$CHANGED" != "0" ]; then
            git add data/latest.json docs/data/latest.json
            git commit -m "Update latest news"
            for attempt in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          else
            echo "No changes to commit."
          fi
