# Configuration for the CBC news scraper.
#
# The scraper relies on official CBC RSS feeds for each section.  The
# "max_items" property defines how many stories to keep for a given
# section over the past 24 hours.  The entertainment and opinion
# sections are capped at five items per day, while all other
# sections are capped at fifty items. Opinion stories are identified
# from article URLs within working feeds; CBC's separate Opinion feed returns HTTP 400.  See README.md for details.

timezone: America/Toronto
rate_limit_seconds: 1
window_hours: 24

# Only run the scraper when the local time (America/Toronto) is
# approximately equal to one of the times listed below.  The script
# evaluates the hour and will exit early if it is not one of the
# allowed slots.  This prevents redundant runs when the action
# triggers every two hours.
allowed_hours:
  - 8
  - 9
  - 10
  - 14
  - 15
  - 20
  - 21

sections:
  top_stories:
    name: Top Stories
    url: https://rss.cbc.ca/lineup/topstories.xml
    max_items: 50
  canada:
    name: Canada
    url: https://rss.cbc.ca/lineup/canada.xml
    max_items: 50
  world:
    name: World
    url: https://rss.cbc.ca/lineup/world.xml
    max_items: 50
  business:
    name: Business
    url: https://rss.cbc.ca/lineup/business.xml
    max_items: 50
  technology_science:
    name: Technology & Science
    url: https://rss.cbc.ca/lineup/technology.xml
    max_items: 50
  health:
    name: Health
    url: https://rss.cbc.ca/lineup/health.xml
    max_items: 50
  entertainment:
    name: Entertainment
    url: https://rss.cbc.ca/lineup/arts.xml
    max_items: 5

  aljazeera:
    name: Al Jazeera
    source: Al Jazeera
    country: Qatar
    url: https://www.aljazeera.com/xml/rss/all.xml
    max_items: 30
  scmp:
    name: South China Morning Post
    source: South China Morning Post
    country: Hong Kong, China
    url: https://www.scmp.com/rss/91/feed
    max_items: 30
  thehindu:
    name: The Hindu
    source: The Hindu
    country: India
    url: https://www.thehindu.com/news/international/feeder/default.rss
    max_items: 30
  bbc:
    name: BBC
    source: BBC
    country: United Kingdom
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    max_items: 30
  abc:
    name: ABC News
    source: ABC News
    country: Australia
    url: https://www.abc.net.au/news/feed/51120/rss.xml
    max_items: 30
  france24:
    name: France 24
    source: France 24
    country: France
    url: https://www.france24.com/en/rss
    max_items: 30
  chinadaily:
    name: China Daily
    source: China Daily
    country: China
    url: https://www.chinadaily.com.cn/rss/world_rss.xml
    max_items: 30

# Set this to true to allow the scraper to fetch the full article
# page and perform a deeper summary.  Because the scraper is
# designed to respect the site’s terms of service and avoid heavy
# scraping, this is disabled by default.
allow_extract: false
permissions:
  contents: write
